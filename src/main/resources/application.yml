spring:
  application:
    name: mecano
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mecano}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:PT1H}
    admin:
      name: ${ADMIN_NAME:Administrador}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  # Limite por IP nos endpoints públicos (proteção contra força bruta).
  rate-limit:
    login:
      max-requests: ${RATE_LIMIT_LOGIN:10}
      window: PT1M
    tracking:
      max-requests: ${RATE_LIMIT_TRACKING:30}
      window: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
# Execução local: valores padrão só para desenvolvimento e avaliação na máquina. Fora deste perfil, banco, segredo
# do JWT e senha do administrador precisam vir das variáveis de ambiente.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    username: ${DB_USERNAME:mecano}
    password: ${DB_PASSWORD:mecano}
  jpa:
    show-sql: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:mecano-segredo-local-somente-para-desenvolvimento}
    admin:
      email: ${ADMIN_EMAIL:admin@mecano.local}
      password: ${ADMIN_PASSWORD:admin-mecano}

logging:
  level:
    br.dev.lucasaguiar.mecano: DEBUG

---
# Dados de demonstração (DemoDataInitializer). Ative junto com outro perfil: SPRING_PROFILES_ACTIVE=local,demo.
spring:
  config:
    activate:
      on-profile: demo

app:
  demo:
    password: ${DEMO_PASSWORD:demo-mecano}

---
# Datasource fornecido pelo Testcontainers (@ServiceConnection).
spring:
  config:
    activate:
      on-profile: test

app:
  security:
    jwt:
      secret: test-secret-only-for-automated-tests-0123456789
  # Os testes fazem muitos logins a partir do mesmo IP; RateLimitIntegrationTest usa limites próprios.
  rate-limit:
    login:
      max-requests: 100000
    tracking:
      max-requests: 100000
