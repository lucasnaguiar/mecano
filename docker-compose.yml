# Sobe o ambiente completo sem configuração: os valores padrão abaixo são só para uso local.
# Para trocar algum, copie .env.example para .env e ajuste.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mecano}
      POSTGRES_USER: ${DB_USERNAME:-mecano}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mecano}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local,demo}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mecano}
      DB_USERNAME: ${DB_USERNAME:-mecano}
      DB_PASSWORD: ${DB_PASSWORD:-mecano}
      JWT_SECRET: ${JWT_SECRET:-mecano-segredo-local-somente-para-desenvolvimento}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT1H}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mecano.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-mecano}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-mecano}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_TRACKING: ${RATE_LIMIT_TRACKING:-30}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

volumes:
  postgres-data:
